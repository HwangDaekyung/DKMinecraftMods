name: Build Installer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ── macOS .app ─────────────────────────────────────────────
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install -r requirements.txt
        working-directory: installer

      - name: 아이콘 생성
        run: python3 make_icon.py
        working-directory: installer

      - name: 빌드
        run: bash build_mac.sh
        working-directory: installer

      - name: zip 압축
        run: zip -r DKInstaller-mac.zip installer/dist/DKInstaller.app

      - name: 임시 저장
        uses: actions/upload-artifact@v4
        with:
          name: DKInstaller-mac
          path: DKInstaller-mac.zip

  # ── Windows .exe ───────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install -r requirements.txt
        working-directory: installer

      - name: 빌드
        run: cmd /c build_windows.bat
        working-directory: installer

      - name: 임시 저장
        uses: actions/upload-artifact@v4
        with:
          name: DKInstaller-windows
          path: installer/dist/DKInstaller.exe

  # ── Release 업로드 ──────────────────────────────────────────
  release:
    needs: [ build-mac, build-windows ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: mac 다운로드
        uses: actions/download-artifact@v4
        with:
          name: DKInstaller-mac

      - name: windows 다운로드
        uses: actions/download-artifact@v4
        with:
          name: DKInstaller-windows

      - name: Release에 업로드 (Public repo)
        uses: softprops/action-gh-release@v2
        with:
          repository: HwangDaekyung/DKMinecraftMods   # Public repo에 배포
          token: ${{ secrets.PUBLIC_REPO_TOKEN }}
          tag_name: installer-latest
          name: "파산게임2 설치 프로그램 (최신)"
          body: |
            ## 파산게임2 모드 설치 프로그램

            - **Windows**: `DKInstaller.exe` 다운로드 후 실행
            - **macOS**: `DKInstaller-mac.zip` 다운로드 후 압축 해제 → `DKInstaller.app` 실행
          files: |
            DKInstaller-mac.zip
            DKInstaller.exe
          make_latest: false
